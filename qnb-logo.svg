<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120">
  <g transform="translate(60,60)">
    <!-- 8 arrow/chevron shapes forming a star - Dark Navy Blue -->
    <!-- Top arrow -->
    <path d="M0,-44 L-10,-20 L-4,-20 L-4,-8 L4,-8 L4,-20 L10,-20 Z" fill="#0D2240"/>
    <!-- Bottom arrow -->
    <path d="M0,44 L-10,20 L-4,20 L-4,8 L4,8 L4,20 L10,20 Z" fill="#0D2240"/>
    <!-- Left arrow -->
    <path d="M-44,0 L-20,-10 L-20,-4 L-8,-4 L-8,4 L-20,4 L-20,10 Z" fill="#0D2240"/>
    <!-- Right arrow -->
    <path d="M44,0 L20,-10 L20,-4 L8,-4 L8,4 L20,4 L20,10 Z" fill="#0D2240"/>
    <!-- Top-Left diagonal -->
    <path d="M-31,-31 L-14,-22 L-18,-18 L-10,-10 L-10,-10 L-18,-18 L-22,-14 Z" fill="#0D2240" transform="rotate(0)"/>
    <path d="M-31,-31 L-13,-24 L-24,-13 Z" fill="#0D2240"/>
    <!-- Top-Right diagonal -->
    <path d="M31,-31 L13,-24 L24,-13 Z" fill="#0D2240"/>
    <!-- Bottom-Left diagonal -->
    <path d="M-31,31 L-13,24 L-24,13 Z" fill="#0D2240"/>
    <!-- Bottom-Right diagonal -->
    <path d="M31,31 L13,24 L24,13 Z" fill="#0D2240"/>
    <!-- Pink/Magenta crown at top -->
    <path d="M0,-48 L-8,-32 L0,-38 L8,-32 Z" fill="#D6175E"/>
    <path d="M-12,-32 L0,-48 L12,-32 L6,-28 L0,-36 L-6,-28 Z" fill="#D6175E"/>
  </g>
  <!-- QNB Text - Bold Navy -->
  <text x="110" y="78" font-family="Arial Black,Arial,Helvetica,sans-serif" font-weight="900" font-size="72" fill="#0D2240" letter-spacing="4">QNB</text>
</svg>
